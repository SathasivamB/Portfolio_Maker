    <!-- Self-healing: Automatically unregister any stale localhost Service Workers that hijack network traffic -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister().then(function() {
              console.log('✓ Successfully unregistered stale Service Worker');
            });
          }
        }).catch(function() {});
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) caches.delete(names[j]);
          }).catch(function() {});
        }
      }
    </script>
